[package]
name = "arcsonare"
version = "0.2.14"
description = "ArcSonare — Sonare Desktop overlay"
edition = "2021"

[lib]
name = "arcsonare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# Screen Context: monitor enumeration + capture (Windows GDI/DXGI backend).
xcap = "0.9"
# Provider credentials in Windows Credential Manager — never in plain files.
keyring = { version = "3", features = ["windows-native"] }
# Local-first operational database (per-user isolation).
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Safe default-browser / file opening (never raw shell with spoken input).
open = "5"
percent-encoding = "2"
# Local Ollama HTTP API (localhost only).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Capability engine: real local datetime (never the model's guess).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
# Windows known-folder resolution (Desktop may be redirected, e.g. OneDrive).
dirs = "6"
# Recycle Bin deletion via IFileOperation — never permanent by default.
trash = "5"
# Application discovery: App Paths + protocol handlers from the registry.
winreg = "0.55"
# Clipboard read/write with readback verification.
arboard = { version = "3", default-features = false, features = ["windows-sys"] }
# Native file-picker dialog (custom background image).
rfd = "0.15"
# Local account password hashing (Argon2id, salted, never stored in plaintext).
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
