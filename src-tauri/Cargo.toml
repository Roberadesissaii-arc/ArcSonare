[package]
name = "arcsonare"
version = "0.2.0"
description = "ArcSonare — Sonare Desktop overlay"
edition = "2021"

[lib]
name = "arcsonare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# Screen Context: monitor enumeration + capture (Windows GDI/DXGI backend).
xcap = "0.9"
# Provider credentials in Windows Credential Manager — never in plain files.
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
# Safe default-browser / file opening (never raw shell with spoken input).
open = "5"
percent-encoding = "2"
# Local Ollama HTTP API (localhost only).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
